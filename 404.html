<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RAWx Storyboard Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // GitHub Pages SPA redirect: preserves path and query parameters
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body style="background-color: #050505; color: #D4AF37; font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div>[ RAWx Storyboard Studio // Initializing Stage... ]</div>
</body>
</html>
