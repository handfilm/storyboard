[package]
name = "handfilm-cockpit"
version = "0.1.0"
description = "HANDFILM Director's Cockpit & External Pipeline Orchestrator"
authors = ["HANDFILM Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
notify = "6.1"
log = "0.4.35"
tauri-plugin-log = "2.10.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
