[package]
name = "handfilm-cockpit"
version = "0.1.0"
description = "HANDFILM Director's Cockpit & External Pipeline Orchestrator"
authors = ["HANDFILM Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "fs-all", "dialog-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
notify = "6.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
